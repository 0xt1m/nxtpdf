name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # PDFium is only needed to run the app, not to typecheck or lint it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          SKIP_PDFIUM_DOWNLOAD: '1'

      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm exec vite build

  backend:
    name: Backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # tauri-build validates everything tauri.conf.json declares, including
      # the bundled PDFium resource. Without it the build script fails before
      # a single line of Rust is compiled, so this job has to install the same
      # dependencies a real build does rather than faking a frontend.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri.conf.json points frontendDist at ../dist, which only exists
      # after a frontend build. Compiling Rust does not need its contents.
      - name: Create frontend dist placeholder
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Content dist/index.html '<!doctype html><title>ci</title>'
        shell: pwsh

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
