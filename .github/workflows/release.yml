name: Release

# Cutting a release is `git tag v1.0.0 && git push --tags`. Everything below
# happens on the runner so a release can never depend on one laptop's setup.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    permissions:
      # tauri-action creates the release and uploads the artifacts.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # A tag that disagrees with the version files produces a release nobody
      # is ever offered: the updater compares latest.json's version (taken from
      # tauri.conf.json) against the running build, so v1.1.0 carrying 1.0.0
      # looks published but updates no one. Fail loudly instead.
      - name: Check the tag matches the version files
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)

          echo "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"

          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Version mismatch. Run 'pnpm version:set $tag', commit, then re-tag."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # PDFium is a native library fetched at install time, not vendored.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this the installers still build, but the .sig files are
          # missing and the updater rejects the release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NXTPDF ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: true
          prerelease: false
          # Generates latest.json and attaches it, which is what the updater
          # fetches from /releases/latest/download/latest.json.
          includeUpdaterJson: true
